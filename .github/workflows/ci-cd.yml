name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/infra-health-dashboard:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/infra-health-dashboard:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/infra-health-dashboard:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/infra-health-dashboard:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to kind cluster over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl set image deployment/infra-dashboard infra-dashboard=${{ secrets.DOCKERHUB_USERNAME }}/infra-health-dashboard:latest
            kubectl rollout restart deployment/infra-dashboard
            kubectl rollout status deployment/infra-dashboard
